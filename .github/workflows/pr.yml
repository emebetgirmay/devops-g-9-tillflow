name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: IaC scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (infra/)
        env:
          TRIVY_VERSION: "0.56.2"
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/scan" \
            -w /scan \
            "aquasec/trivy:${TRIVY_VERSION}" \
            config infra/ \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignorefile .trivyignore \
              --tf-exclude-downloaded-modules

  terraform:
    name: Terraform fmt + validate + plan
    runs-on: ubuntu-latest
    needs: [gitleaks, iac-scan]
    defaults:
      run:
        working-directory: infra/envs/sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: eu-north-1
          audience: sts.amazonaws.com

      - name: terraform plan
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        run: |
          terraform init -backend-config=backend.hcl
          # Wait for a running Release apply instead of failing on its state lock.
          terraform plan -input=false -no-color -lock-timeout=5m -out=plan.bin

      - name: Upload plan
        if: ${{ vars.AWS_CI_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/envs/sandbox/plan.bin
          retention-days: 7

  pos-tests:
    name: POS unit + invariant tests
    runs-on: ubuntu-latest
    needs: [gitleaks]
    defaults:
      run:
        working-directory: services/pos
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: pytest against Postgres 16 (ADR 0002 RDS readiness — same suite, real driver)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pos_test
        run: pytest -q
      - name: pytest (70% line coverage floor)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  pos-docker:
    name: Build POS image
    runs-on: ubuntu-latest
    needs: [gitleaks, pos-tests]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t local/pos:pr services/pos

      # Start the image the way ECS does (same OTEL_* variables as ecs.tf) and require /ready.
      # Unit tests never start the app like this, so a dependency that breaks start-up only
      # showed up as a failed deploy and rollback (FastAPI 0.142.0, G3).
      - name: Start-up smoke (ECS environment)
        run: |
          set -euo pipefail
          docker run -d --name pos-smoke -p 18080:8080 \
            -e OTEL_SERVICE_NAME=pos \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 \
            -e ADOT_HEALTH_URL=http://127.0.0.1:13133/ \
            -e DATABASE_URL=sqlite:////tmp/pos.db \
            local/pos:pr
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              echo "POS started"; docker rm -f pos-smoke >/dev/null; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pos-smoke)" != "true" ]; then break; fi
            sleep 1
          done
          echo "POS did not start with the ECS environment:"; docker logs pos-smoke; exit 1

      - name: Trivy image scan
        env:
          TRIVY_VERSION: "0.56.2"
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed local/pos:pr

  payments-tests:
    name: Payments unit tests
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared + Payments unittest
        run: |
          set -euo pipefail
          (cd services/_shared && python3 -m unittest discover -s tests -t .)
          (cd services/payments && python3 -m unittest discover -s tests)

  payments-docker:
    name: Build Payments image
    runs-on: ubuntu-latest
    needs: [gitleaks, payments-tests]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f services/payments/Dockerfile -t local/payments:pr .

      - name: Trivy image scan
        env:
          TRIVY_VERSION: "0.56.2"
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed local/payments:pr

  commission-tests:
    name: Commission unit + end-to-end tests
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The end-to-end test runs the real POS app, so it needs POS's dependencies.
      - name: Install POS deps
        run: pip install -r services/pos/requirements.txt
      - name: Commission unittest
        working-directory: services/commission
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee test.log
          # The end-to-end tests skip themselves without POS's deps; never let that pass silently.
          if grep -q "skipped" test.log; then
            echo "::error::Commission tests were skipped"
            exit 1
          fi

  commission-docker:
    name: Build Commission image
    runs-on: ubuntu-latest
    needs: [gitleaks, commission-tests]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t local/commission:pr services/commission

      - name: Trivy image scan
        env:
          TRIVY_VERSION: "0.56.2"
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image --severity HIGH,CRITICAL --exit-code 1 \
            --ignore-unfixed local/commission:pr

  reliability-tests:
    name: Alerting Lambda unit tests
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slack notifier unittest
        working-directory: infra/envs/sandbox/lambda/slack_notifier
        run: python3 -m unittest -v
      - name: Edge probe unittest
        working-directory: infra/envs/sandbox/lambda/probe
        run: python3 -m unittest -v
      - name: Reconcile sweep unittest
        working-directory: infra/envs/sandbox/lambda/reconcile_sweep
        run: python3 -m unittest -v
